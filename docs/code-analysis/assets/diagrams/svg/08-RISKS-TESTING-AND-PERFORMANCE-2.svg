<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 500px; background-color: white;" viewBox="0 0 500 500" role="graphics-document document" aria-roledescription="quadrantChart"><style>#my-svg{font-family:Noto Sans CJK SC,Noto Sans CJK TC,Noto Sans,Arial,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#552222;}#my-svg .error-text{fill:#552222;stroke:#552222;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#334155;stroke:#334155;}#my-svg .marker.cross{stroke:#334155;}#my-svg svg{font-family:Noto Sans CJK SC,Noto Sans CJK TC,Noto Sans,Arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .node .neo-node{stroke:#999;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#999;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:Noto Sans CJK SC,Noto Sans CJK TC,Noto Sans,Arial,sans-serif;}</style><g/><g class="main"><g class="quadrants"><g class="quadrant"><rect x="263" y="45" width="232" height="212" fill="#eef4ff"/><text x="0" y="0" fill="#172033" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 50) rotate(0)">Prioritize / 优先处理</text></g><g class="quadrant"><rect x="31" y="45" width="232" height="212" fill="#f3f9ff"/><text x="0" y="0" fill="#121b2e" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 50) rotate(0)">Guard continuously / 持续防护</text></g><g class="quadrant"><rect x="31" y="257" width="232" height="212" fill="#f8feff"/><text x="0" y="0" fill="#0d1629" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 262) rotate(0)">Observe / 观察</text></g><g class="quadrant"><rect x="263" y="257" width="232" height="212" fill="#fdffff"/><text x="0" y="0" fill="#081124" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 262) rotate(0)">Plan / 规划</text></g></g><g class="border"><line x1="30" y1="45" x2="496" y2="45" style="stroke: rgb(66, 99, 168); stroke-width: 2;"/><line x1="495" y1="46" x2="495" y2="468" style="stroke: rgb(66, 99, 168); stroke-width: 2;"/><line x1="30" y1="469" x2="496" y2="469" style="stroke: rgb(66, 99, 168); stroke-width: 2;"/><line x1="31" y1="46" x2="31" y2="468" style="stroke: rgb(66, 99, 168); stroke-width: 2;"/><line x1="263" y1="46" x2="263" y2="468" style="stroke: rgb(66, 99, 168); stroke-width: 1;"/><line x1="32" y1="257" x2="494" y2="257" style="stroke: rgb(66, 99, 168); stroke-width: 1;"/></g><g class="data-points"><g class="data-point"><circle cx="179.48000000000002" cy="341.79999999999995" r="5" fill="hsl(218.8235294118, 100%, NaN%)" stroke="hsl(218.8235294118, 100%, NaN%)" stroke-width="0px"/><text x="0" y="0" fill="#172033" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(179.48000000000002, 346.79999999999995) rotate(0)">Documentation drift</text></g><g class="data-point"><circle cx="142.35999999999999" cy="214.60000000000002" r="5" fill="hsl(218.8235294118, 100%, NaN%)" stroke="hsl(218.8235294118, 100%, NaN%)" stroke-width="0px"/><text x="0" y="0" fill="#172033" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(142.35999999999999, 219.60000000000002) rotate(0)">CommonJS migration</text></g><g class="data-point"><circle cx="365.08" cy="307.88" r="5" fill="hsl(218.8235294118, 100%, NaN%)" stroke="hsl(218.8235294118, 100%, NaN%)" stroke-width="0px"/><text x="0" y="0" fill="#172033" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(365.08, 312.88) rotate(0)">Long-term dogfood</text></g><g class="data-point"><circle cx="309.4" cy="214.60000000000002" r="5" fill="hsl(218.8235294118, 100%, NaN%)" stroke="hsl(218.8235294118, 100%, NaN%)" stroke-width="0px"/><text x="0" y="0" fill="#172033" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(309.4, 219.60000000000002) rotate(0)">No automated DevTools</text></g><g class="data-point"><circle cx="179.48000000000002" cy="121.32000000000002" r="5" fill="hsl(218.8235294118, 100%, NaN%)" stroke="hsl(218.8235294118, 100%, NaN%)" stroke-width="0px"/><text x="0" y="0" fill="#172033" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(179.48000000000002, 126.32000000000002) rotate(0)">Toolchain byte drift</text></g><g class="data-point"><circle cx="318.67999999999995" cy="163.72000000000003" r="5" fill="