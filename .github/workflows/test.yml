name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- 0.10.12+1634b282e
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.8.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install JS tooling
        run: |
          node --version
          bun --version
          bun install --frozen-lockfile

      - name: Dependency advisory scan
        continue-on-error: true
        timeout-minutes: 3
        run: bun audit --audit-level=high

      - name: MoonBit environment
        run: |
          moon update
          version_output="$(moon version --all)"
          printf '%s\n' "$version_output"
          installed_moon="$(printf '%s\n' "$version_output" | awk '$1 == "moon" { print $2; exit }')"
          installed_moonc="$(printf '%s\n' "$version_output" | awk '$1 == "moonc" { sub(/^v/, "", $2); split($2, parts, "+"); print parts[1]; exit }')"
          version_at_least() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n 1)" = "$1" ]
          }
          version_at_least "0.1.20260904" "$installed_moon" || {
            echo "moon $installed_moon is below the supported floor 0.1.20260904" >&2
            exit 1
          }
          version_at_least "0.10.12" "$installed_moonc" || {
            echo "moonc $installed_moonc is below the supported floor 0.10.12" >&2
            exit 1
          }

      - name: Minimoon candidate gate
        run: |
          moon info
          moon fmt --check
          moon test --target native
          moon test --target js
          bun run check:coverage
          bun run check:candidate
          git diff --check

      - name: Generated and interface drift
        run: |
          git diff --exit-code

      - name: Prepare WeChat Developer Tools handoffs
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' moon.mod)"
          ui_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' ui/moon.mod)"
          if [ "$core_version" != "0.2.0" ] || [ "$ui_version" != "0.1.0" ] ||
             ! grep -Fq "\"lampclaw/minimoon@$core_version\"" ui/moon.mod; then
            echo "CI handoff requires the reviewed core 0.2.0 / UI 0.1.0 release pair" >&2
            exit 1
          fi
          moon_version="$(moon version --all)"
          node_version="$(node --version)"
          bun_version="$(bun --version)"

          package_handoff() {
            local fixture="$1" name="$2" bundle="$3" page_count="$4"
            local handoff_dir="_build/devtools-handoff/$bundle"
            local report="$fixture/generated/verify_report.json"
            local fingerprint file
            jq -e '.schemaVersion == 1 and .status == "passed" and (.checks | length > 0) and all(.checks[]; .status == "passed")' "$report" >/dev/null || {
              echo "candidate handoff requires a passed automated report" >&2
              exit 1
            }
            jq -e '.release == false' "$report" >/dev/null || {
              echo "CI handoff accepts candidate verification reports only" >&2
              exit 1
            }
            fingerprint="$(jq -er '.artifactFingerprint | select(type == "string" and test("^fnv1a64-relpath-v2:[0-9a-f]{1,16}$"))' "$report")"
            jq -e --arg name "$name" --arg fingerprint "$fingerprint" --arg ui_version "$ui_version" --arg bundle "$bundle" --argjson page_count "$page_count" \
              --slurpfile manifest "$fixture/generated/manifest.json" \
              --slurpfile app_config "$fixture/dist/app.json" \
              --slurpfile checklist "$fixture/generated/smoke_checklist.json" \
              '.mode == "release" and .name == $name and .schemaVersion == 11 and .runtimeApiVersion == 13 and .rendererProtocolVersion == 8 and
               .automated.status == "passed" and .automated.pageCount == $page_count and .automated.artifactFingerprint == $fingerprint and
               .devtools.status == "pending" and .devtools.evidence == null and .devtools.artifactFingerprint == null and (.devtools | keys) == ["evidence", "status"] and
               $manifest[0].name == $name and $manifest[0].schemaVersion == 11 and $manifest[0].runtimeApiVersion == 13 and $manifest[0].rendererProtocolVersion == 8 and
               $manifest[0].pageBridgeEncoding == "shared-compact-node-v1" and
               ($manifest[0].pages | length) == $page_count and all($manifest[0].pages[]; .schemaVersion == 11 and .runtimeApiVersion == 13 and .rendererProtocolVersion == 8) and
               ($bundle != "core" or (
                 [$manifest[0].pages[].route] == ["pages/workbench/workbench", "pages/drafts/drafts", "pages/online/online", "pages/more/more", "pages/interaction/interaction", "pages/platform/platform", "pages/request_lifecycle/request_lifecycle", "pages/runtime_lab/runtime_lab", "pages/draft_editor/draft_editor"] and
                 [$manifest[0].tabBar.list[].pagePath] == ["pages/workbench/workbench", "pages/drafts/drafts", "pages/online/online", "pages/more/more"] and
                 $manifest[0].tabBar == $app_config[0].tabBar)) and
               ($bundle != "ui" or any($manifest[0].resources[]; .package == "lampclaw/minimoon_ui/resources" and .version == $ui_version)) and
               $checklist[0].runtimeApiVersion == 13 and $checklist[0].rendererProtocolVersion == 8 and
               $checklist[0].pages == [$manifest[0].pages[].route] and ($checklist[0].checks | length > 0)' \
              "$fixture/generated/release_summary.json" >/dev/null || {
              echo "CI handoff requires matching versions, pages, fingerprints, and pending private-evidence-free summaries" >&2
              exit 1
            }
            jq -e '.appid == "touristappid" and .setting.es6 == true and .setting.enhance == true and .setting.minified == true and .setting.skylineRenderEnable == true' \
              "$fixture/dist/project.config.json" >/dev/null || {
              echo "CI handoff requires public placeholder AppID and reviewed Developer Tools settings" >&2
              exit 1
            }
            jq -e '.renderer == "skyline" and .componentFramework == "glass-easel"' "$fixture/dist/app.json" >/dev/null
            if [ -n "$(find "$fixture/dist" ! -type d ! -type f -print -quit)" ]; then
              echo "CI handoff rejects symlinks and non-regular dist entries" >&2
              exit 1
            fi
            while IFS= read -r -d '' file; do
              case "$file" in
                "$fixture/dist/project.private.config.example.json")
                  jq -e '. == {appid: "xxxxx-your-wechat-miniapp-appid", libVersion: "3.17.0"}' "$file" >/dev/null || {
                    echo "CI handoff requires the public private-config example to contain only placeholder AppID and baseline library" >&2
                    exit 1
                  }
                  ;;
                */.*|*/project.private.*|*evidence*|*.pem|*.key|*.log|*/node_modules/*|*/_build/*)
                  echo "CI handoff rejects private, hidden, credential, log, and cache files" >&2
                  exit 1
                  ;;
              esac
              git ls-files --error-unmatch -- "$file" >/dev/null 2>&1 || {
                echo "CI handoff accepts committed dist files only" >&2
                exit 1
              }
            done < <(find "$fixture/dist" -type f -print0)
            mkdir -p "$handoff_dir"
            if [ -n "$(find "$handoff_dir" -mindepth 1 -print -quit)" ]; then
              echo "CI handoff output directory must be empty" >&2
              exit 1
            fi
            cp -R "$fixture/dist" "$handoff_dir/dist"
            for file in manifest.json verify_report.json release_summary.json smoke_checklist.json; do
              cp "$fixture/generated/$file" "$handoff_dir/$file"
            done
            cp docs/operations/miniapp_devtools_validation.md "$handoff_dir/VALIDATION.md"
            jq -n \
              --arg fixture "$name" --arg appDirectory "$fixture" \
              --arg commit "$GITHUB_SHA" --arg fingerprint "$fingerprint" --arg runner "$RUNNER_OS" \
              --arg coreVersion "$core_version" --arg uiVersion "$ui_version" \
              --arg moon "$moon_version" --arg node "$node_version" --arg bun "$bun_version" \
              --slurpfile manifest "$handoff_dir/manifest.json" \
              '{schemaVersion: 2, fixture: $fixture, appDirectory: $appDirectory, commit: $commit, artifactFingerprint: $fingerprint,
                versions: {minimoon: $coreVersion, minimoonUi: $uiVersion,
                  appContract: $manifest[0].schemaVersion, runtimeAbi: $manifest[0].runtimeApiVersion, rendererProtocol: $manifest[0].rendererProtocolVersion},
                toolchain: {moon: $moon, node: $node, bun: $bun}, runner: $runner, importDirectory: "dist/",
                projectSettings: {renderer: "skyline", es6: true, enhance: true, minified: true, minimumBaseLibrary: "3.17.0"},
                evidenceStatus: "pending-manual-devtools-validation"}' > "$handoff_dir/HANDOFF.json"
            if grep -ERq 'wx[[:xdigit:]]{16}|BEGIN ([A-Z ]+ )?PRIVATE KEY' "$handoff_dir"; then
              echo "CI handoff rejects real AppIDs and credential material" >&2
              exit 1
            fi
            (
              cd "$handoff_dir"
              find dist manifest.json verify_report.json release_summary.json smoke_checklist.json VALIDATION.md HANDOFF.json -type f -print0 |
                LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
              sha256sum --check --strict SHA256SUMS
              zip -X -qr "$name-dist.zip" dist
              sha256sum "$name-dist.zip" > ARCHIVE_SHA256
              sha256sum --check --strict ARCHIVE_SHA256
            )
          }

          package_handoff examples/miniapp_draft_workbench miniapp_draft_workbench core 9
          package_handoff ui/examples/showcase minimoon_ui_showcase ui 6

      - name: Final source cleanliness
        run: |
          source_status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$source_status" ]; then
            printf '%s\n' "$source_status"
            echo "CI requires a clean tracked and untracked worktree" >&2
            exit 1
          fi
          git diff --exit-code

      - name: Upload core WeChat Developer Tools handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: minimoon-devtools-${{ github.sha }}
          path: _build/devtools-handoff/core/
          if-no-files-found: error
          retention-days: 14

      - name: Upload UI WeChat Developer Tools handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: minimoon-ui-devtools-${{ github.sha }}
          path: _build/devtools-handoff/ui/
          if-no-files-found: error
          retention-days: 14

  node-lts-compat:
    name: Node 24 LTS compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- 0.10.12+1634b282e
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup Node 24 LTS floor
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install toolchains and dependencies
        run: |
          node --version
          bun --version
          bun install --frozen-lockfile
          moon update

      - name: Validate Node 24 compatibility surface
        run: |
          moon test --target js
          moon run src/cmd/minimoon --target native -- check --suite generator
          git diff --check

      - name: Final source cleanliness
        run: |
          source_status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$source_status" ]; then
            printf '%s\n' "$source_status"
            echo "CI requires a clean tracked and untracked worktree" >&2
            exit 1
          fi
          git diff --exit-code
